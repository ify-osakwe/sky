name: Scheduled Shutdown
on:
  schedule:
    - cron: '0 18 * * *'   # Trigger Shut down in UTC
    - cron: '0 9 * * *'  # Trigger Start up in UTC
  workflow_dispatch:      # Allows you to manually test right now from GitHub UI
    inputs:
      action:
        description: 'Manually test action'
        required: true
        default: 'scale-down'
        type: choice
        options:
          - scale-down
          - scale-up

jobs:
  toggle-service:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Target Replicas
        id: determine_replicas
        run: |
          # Default to 1 replica (Service UP)
          REPLICAS=1
          
          # If triggered by the shutdown cron OR a manual 'scale-down' selection
          if [ "${{ github.event.schedule }}" = "0 18 * * *" ] || [ "${{ github.event.inputs.action }}" = "scale-down" ]; then
            REPLICAS=0
          fi
          
          echo "replicas=$REPLICAS" >> $GITHUB_OUTPUT

      - name: Toggle Railway Service via GraphQL API
        run: |
          curl --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header 'Authorization: Bearer ${{ secrets.RAILWAY_PROJECTS_TOKEN }}' \
            --header 'Content-Type: application/json' \
            --data '{
              "query": "mutation serviceInstanceUpdate($serviceId: String!, $environmentId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }",
              "variables": {
                "serviceId": "${{ secrets.RAILWAY_SERVICE_ID }}",
                "environmentId": "${{ secrets.RAILWAY_ENVIRONMENT_ID }}",
                "input": {
                  "numReplicas": ${{ steps.determine_replicas.outputs.replicas }}
                }
              }
            }'